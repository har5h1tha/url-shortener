<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body {
      margin: 0; background: #f4f4f5; color: #18181b;
    }
    .page {
      max-width: 760px; margin: 2.5rem auto; padding: 0 1rem;
    }
    .card {
      background: white; padding: 1.5rem; border-radius: 12px;
      border: 1px solid #e4e4e7;
    }
    h1 { margin: 0 0 1rem; font-size: 1.5rem; }
    h2 { margin: 0 0 0.75rem; font-size: 1.1rem; }
    .section + .section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e4e4e7; }
    input {
      width: 100%; padding: 0.7rem; border: 1px solid #ddd;
      border-radius: 8px; font-size: 1rem; margin-bottom: 0.75rem;
    }
    button {
      width: 100%; padding: 0.7rem; background: #2563eb; color: white;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #a5a5a5; cursor: not-allowed; }
    .result {
      margin-top: 1.25rem; padding: 1rem; background: #f0fdf4;
      border-radius: 8px; word-break: break-all; display: none;
    }
    .result.show { display: block; }
    .result a { color: #16a34a; font-weight: 600; text-decoration: none; }
    .error {
      margin-top: 1.25rem; padding: 1rem; background: #fef2f2;
      color: #b91c1c; border-radius: 8px; display: none;
    }
    .error.show { display: block; }
    .meta { font-size: 0.85rem; color: #666; margin-top: 0.5rem; }
    .status {
      margin-top: 0.75rem; padding: 0.7rem 0.8rem;
      border-radius: 8px; font-size: 0.92rem; display: none;
    }
    .status.show { display: block; }
    .status.loading { background: #eff6ff; color: #1e3a8a; }
    .status.empty { background: #f8fafc; color: #334155; }
    .status.error { background: #fef2f2; color: #b91c1c; }
    .analytics-panel { margin-top: 1rem; display: none; }
    .analytics-panel.show { display: block; }
    .metric {
      padding: 0.8rem; border: 1px solid #e4e4e7; border-radius: 8px;
      margin-bottom: 1rem;
    }
    .metric-label { color: #52525b; font-size: 0.85rem; }
    .metric-value { font-size: 1.5rem; font-weight: 700; margin-top: 0.15rem; }
    table {
      width: 100%; border-collapse: collapse; border: 1px solid #e4e4e7;
      border-radius: 8px; overflow: hidden;
    }
    th, td { text-align: left; padding: 0.6rem 0.7rem; font-size: 0.92rem; }
    th { background: #f8fafc; border-bottom: 1px solid #e4e4e7; }
    tr + tr td { border-top: 1px solid #f1f5f9; }
    .bars { margin-top: 1rem; }
    .bar-row {
      display: grid; grid-template-columns: 92px 1fr 48px; gap: 0.6rem;
      align-items: center; margin-bottom: 0.5rem; font-size: 0.85rem;
    }
    .bar-track { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: #2563eb; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="section">
        <h1>URL Shortener</h1>

        <input type="url" id="urlInput" placeholder="Paste your long URL here" required>
        <input type="text" id="aliasInput" placeholder="Custom alias (optional)">
        <input type="number" id="expiryInput" placeholder="Expires in days (optional)">

        <button id="shortenBtn">Shorten</button>

        <div class="result" id="result">
          <strong>Short URL:</strong><br>
          <a id="shortLink" href="#" target="_blank"></a>
          <div class="meta" id="meta"></div>
        </div>

        <div class="error" id="error"></div>
      </div>

      <div class="section">
        <h2>Analytics</h2>
        <input type="text" id="analyticsCodeInput" placeholder="Enter short code (e.g. mygh)">
        <button id="analyticsBtn">View Analytics</button>

        <div class="status" id="analyticsStatus"></div>

        <div class="analytics-panel" id="analyticsPanel">
          <div class="metric">
            <div class="metric-label">Total Clicks</div>
            <div class="metric-value" id="totalClicksValue">0</div>
          </div>
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Clicks</th>
              </tr>
            </thead>
            <tbody id="dailyClicksBody"></tbody>
          </table>
          <div class="bars" id="dailyBars"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('shortenBtn')
    const urlInput = document.getElementById('urlInput')
    const aliasInput = document.getElementById('aliasInput')
    const expiryInput = document.getElementById('expiryInput')
    const result = document.getElementById('result')
    const shortLink = document.getElementById('shortLink')
    const meta = document.getElementById('meta')
    const errorBox = document.getElementById('error')
    const analyticsBtn = document.getElementById('analyticsBtn')
    const analyticsCodeInput = document.getElementById('analyticsCodeInput')
    const analyticsStatus = document.getElementById('analyticsStatus')
    const analyticsPanel = document.getElementById('analyticsPanel')
    const totalClicksValue = document.getElementById('totalClicksValue')
    const dailyClicksBody = document.getElementById('dailyClicksBody')
    const dailyBars = document.getElementById('dailyBars')

    function setAnalyticsStatus(type, message) {
      analyticsStatus.className = 'status'
      if (!message) {
        analyticsStatus.textContent = ''
        return
      }
      analyticsStatus.classList.add('show', type)
      analyticsStatus.textContent = message
    }

    function renderAnalytics(data) {
      totalClicksValue.textContent = data.totalClicks ?? 0
      dailyClicksBody.innerHTML = ''
      dailyBars.innerHTML = ''

      const rows = Array.isArray(data.dailyClicks) ? data.dailyClicks : []
      if (!rows.length) {
        analyticsPanel.classList.remove('show')
        setAnalyticsStatus('empty', 'No click data is available for this short code yet.')
        return
      }

      const maxCount = Math.max(...rows.map(row => row.count || 0), 1)
      rows.forEach(row => {
        const dateCell = document.createElement('td')
        dateCell.textContent = row.date
        const countCell = document.createElement('td')
        countCell.textContent = row.count

        const tr = document.createElement('tr')
        tr.appendChild(dateCell)
        tr.appendChild(countCell)
        dailyClicksBody.appendChild(tr)

        const barRow = document.createElement('div')
        barRow.className = 'bar-row'
        barRow.innerHTML = `
          <span>${row.date}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${(row.count / maxCount) * 100}%"></div></div>
          <strong>${row.count}</strong>
        `
        dailyBars.appendChild(barRow)
      })

      setAnalyticsStatus('', '')
      analyticsPanel.classList.add('show')
    }

    btn.addEventListener('click', async () => {
      const url = urlInput.value.trim()
      const alias = aliasInput.value.trim()
      const expiresInDays = expiryInput.value ? Number(expiryInput.value) : undefined

      if (!url) return

      result.classList.remove('show')
      errorBox.classList.remove('show')
      btn.disabled = true
      btn.textContent = 'Shortening...'

      try {
        const res = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url,
            ...(alias && { alias }),
            ...(expiresInDays && { expiresInDays })
          })
        })

        const data = await res.json()

        if (!res.ok) {
          errorBox.textContent = data.error
          errorBox.classList.add('show')
          return
        }

        shortLink.href = data.shortUrl
        shortLink.textContent = data.shortUrl
        meta.textContent = expiresInDays
          ? `Expires in ${expiresInDays} day(s)`
          : 'No expiration'
        result.classList.add('show')

      } catch (err) {
        errorBox.textContent = 'Something went wrong. Try again.'
        errorBox.classList.add('show')
      } finally {
        btn.disabled = false
        btn.textContent = 'Shorten'
      }
    })

    analyticsBtn.addEventListener('click', async () => {
      const code = analyticsCodeInput.value.trim()
      if (!code) return

      analyticsBtn.disabled = true
      analyticsBtn.textContent = 'Loading...'
      analyticsPanel.classList.remove('show')
      setAnalyticsStatus('loading', 'Fetching analytics...')

      try {
        const res = await fetch(`/${encodeURIComponent(code)}/analytics`)
        const data = await res.json()

        if (!res.ok) {
          throw new Error(data.error || 'Unable to fetch analytics.')
        }

        renderAnalytics(data)
      } catch (err) {
        setAnalyticsStatus('error', err.message || 'Unable to fetch analytics.')
      } finally {
        analyticsBtn.disabled = false
        analyticsBtn.textContent = 'View Analytics'
      }
    })
  </script>
</body>
</html>
